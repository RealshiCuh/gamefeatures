<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boda Tag Features</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            padding: 40px 20px;
            background: transparent !important;
            color: #000;
            line-height: 1.8;
        }
        
        html {
            background: transparent !important;
        }
        
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 26px;
            margin-bottom: 35px;
            font-weight: normal;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid #000;
            display: inline-block;
            animation: typing 3s steps(40) 1s forwards, blink 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }
        
        .section {
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 15px;
            margin-bottom: 6px;
            font-weight: normal;
        }
        
        .feature {
            margin-left: 15px;
            margin-bottom: 2px;
            font-size: 14px;
        }
        
        .note {
            margin-left: 15px;
            font-size: 13px;
            color: #666;
            margin-top: 1px;
            margin-bottom: 2px;
        }
        
        .sub-feature {
            margin-left: 30px;
            font-size: 13px;
            color: #444;
            margin-bottom: 1px;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .error {
            color: #d32f2f;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content" class="loading">Loading features...</div>
    </div>

    <script>
        const FEATURES_URL = 'https://github.com/RealshiCuh/gamefeatures/blob/main/main/features.json';
        const CACHE_BUSTER = true; // Set to  true bc to always get fresh data

        async function loadFeatures() {
            try {
                const url = CACHE_BUSTER ? `${FEATURES_URL}?t=${Date.now()}` : FEATURES_URL;
                
                const response = await fetch(url, {
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache'
                    }
                });
                
                if (!response.ok) throw new Error('Failed to load features');
                
                const data = await response.json();
                displayFeatures(data);
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        Couldnt Load Features Will Be Fixed Soon!
                        <br><small>${error.message}</small>
                    </div>
                `;
                console.error('Error loading features:', error);
            }
        }

        function displayFeatures(data) {
            const container = document.getElementById('content');
            
            let html = `<h1>${data.gameName} Features</h1>`;
            html += '<div class="section"><div class="section-title">-> Features</div></div>';
            
            data.sections.forEach(section => {
                html += `<div class="section">`;
                html += `<div class="section-title">\`-> ${section.title} <-\`</div>`;
                
                section.features.forEach(feature => {
                    html += `<div class="feature">* ${feature.name}</div>`;
                    
                    if (feature.note) {
                        html += `<div class="note">-# ${feature.note}</div>`;
                    }
                    
                    if (feature.subFeatures) {
                        feature.subFeatures.forEach(sub => {
                            html += `<div class="sub-feature">-# ${sub}</div>`;
                        });
                    }
                });
                
                html += `</div>`;
            });
            
            container.innerHTML = html;
        }

        loadFeatures();
    </script>
</body>
</html>
