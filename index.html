<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 40px 20px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 25%, #e8e8e8 50%, #f5f5f5 75%, #ffffff 100%);
            background-size: 400% 400%;
            animation: crystalShift 15s ease infinite;
            color: #1a1a1a;
            line-height: 1.8;
            position: relative;
            min-height: 100vh;
        }

        html { background: #ffffff; }

        @keyframes crystalShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(180, 180, 180, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1);           opacity: 0.2; }
            25%       { transform: translate(20px, -30px) scale(1.1);  opacity: 0.5; }
            50%       { transform: translate(-15px, -60px) scale(0.9); opacity: 0.3; }
            75%       { transform: translate(25px, -40px) scale(1.05); opacity: 0.4; }
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: 0.5px;
            overflow: hidden;
            border-right: 3px solid #1a1a1a;
            white-space: nowrap;
            width: 0;
        }

        @keyframes typing {
            from { width: 0; }
            to   { width: 100%; }
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50%      { border-color: #1a1a1a; }
        }

        .section {
            margin-bottom: 24px;
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 400;
            color: #2a2a2a;
            letter-spacing: 0.3px;
        }

        .feature {
            margin-left: 18px;
            margin-bottom: 3px;
            font-size: 14px;
            font-weight: 300;
            color: #3a3a3a;
        }
    </style>
</head>
<body>
    <div id="particles"></div>
    <div class="container" id="content"></div>

    <script>

    const textrig = {

        title: "Aura Runnerss",

        sections: [
            {
                name: "Settings",
                features: [
                    "Right Hand Menu",
                    "Notifications",
                    "Clear Notifications",
                    "Disconnect Button",
                    "Button Mode: Triggers / Normal",
                    "Menu Type: GUI / Holdable"
                ]
            },
            {
                name: "Movement",
                features: [
                    "Scale Control",
                    "Slide Control",
                    "Fly",
                    "Excel Fly",
                    "Trigger Fly",
                    "Joystick Fly",
                    "Speed Boost",
                    "No Clip",
                    "Platforms",
                    "Platform Gun",
                    "Checkpoint",
                    "Force Tag Freeze",
                    "No Tag Freeze",
                    "TP Gun",
                    "Rig Gun",
                    "Up And Down",
                    "Wall Walk",
                    "Long Arms",
                    "Pull Mod"
                ]
            },
            {
                name: "Player",
                features: [
                    "Unlock All",
                    "Loud Hand Taps",
                    "Silent Hand Taps",
                    "Ghost Monkey",
                    "Invis Monkey"
                ]
            },
            {
                name: "Visuals",
                features: [
                    "Beacons",
                    "Chams"
                ]
            },
            {
                name: "Photon",
                features: [
                    "Join Random",
                    "Reconnect",
                    "Send Game Info",
                    "Disable AFK Kick"
                ]
            },
            {
                name: "Overpowered",
                features: [
                    "Tag All V2 [ T ]",
                    "Tag Gun",
                    "Set Master",
                    "Slow All",
                    "Mat All",
                    "Vibrate All",
                    "Crash All",
                    "Crash Gun",
                    "Change GameMode"
                ]
            }
        ]

    };

    document.title = textrig.title;

    const container = document.getElementById('content');

    const h1 = document.createElement('h1');
    h1.textContent = textrig.title;
    container.appendChild(h1);
    h1.style.animation = `typing 2s steps(${textrig.title.length}) 0.5s forwards, blink 0.75s step-end infinite`;

    textrig.sections.forEach((section, i) => {
        const div = document.createElement('div');
        div.className = 'section';
        div.style.animationDelay = (2.5 + i * 0.2) + 's';

        const titleEl = document.createElement('div');
        titleEl.className = 'section-title';
        titleEl.textContent = '`-> ' + section.name + ' <-`';
        div.appendChild(titleEl);

        section.features.forEach(feature => {
            const f = document.createElement('div');
            f.className = 'feature';
            f.textContent = '* ' + feature;
            div.appendChild(f);
        });

        container.appendChild(div);
    });

    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size     = Math.random() * 4 + 2;
        const duration = Math.random() * 20 + 15;
        const delay    = -(Math.random() * 10);
        p.style.cssText = `
            width:  ${size}px;
            height: ${size}px;
            left:   ${Math.random() * 100}%;
            top:    ${Math.random() * 100}%;
            animation: float ${duration}s ${delay}s ease-in-out infinite;
        `;
        particlesContainer.appendChild(p);
    }
    </script>
</body>
</html>
