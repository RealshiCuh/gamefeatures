<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 40px 20px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 25%, #e8e8e8 50%, #f5f5f5 75%, #ffffff 100%);
            background-size: 400% 400%;
            animation: crystalShift 15s ease infinite;
            color: #1a1a1a;
            line-height: 1.8;
            position: relative;
            min-height: 100vh;
        }
        
        html { background: #ffffff; }

        @keyframes crystalShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(200, 200, 200, 0.4);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .container {
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: 0.5px;
            overflow: hidden;
            border-right: 3px solid #1a1a1a;
            white-space: nowrap;
            animation: typing 2s steps(20) 0.5s forwards, blink 0.75s step-end infinite;
            width: 0;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #1a1a1a; }
        }
        
        .section {
            margin-bottom: 24px;
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        
        .section-title {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 400;
            color: #2a2a2a;
            letter-spacing: 0.3px;
        }
        
        .feature {
            margin-left: 18px;
            margin-bottom: 3px;
            font-size: 14px;
            font-weight: 300;
            color: #3a3a3a;
        }
    </style>
</head>
<body>
    <div id="particles"></div>
    <div class="container" id="content"></div>

    <script src="config.js"></script>
    <script>
        const container = document.getElementById('content');
        document.getElementById('page-title').textContent = SITE_CONFIG.title;

        const h1 = document.createElement('h1');
        h1.textContent = SITE_CONFIG.title;
        container.appendChild(h1);

        SITE_CONFIG.sections.forEach((section, i) => {
            const div = document.createElement('div');
            div.className = 'section';
            div.style.animationDelay = (2.5 + i * 0.2) + 's';

            const title = document.createElement('div');
            title.className = 'section-title';
            title.textContent = '`-> ' + section.name + ' <-`';
            div.appendChild(title);

            section.features.forEach(feature => {
                const f = document.createElement('div');
                f.className = 'feature';
                f.textContent = '* ' + feature;
                div.appendChild(f);
            });

            container.appendChild(div);
        });

        // Particles
        const particlesContainer = document.getElementById('particles');
        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
                25%  { transform: translate(20px, -30px) scale(1.1); opacity: 0.6; }
                50%  { transform: translate(-15px, -60px) scale(0.9); opacity: 0.4; }
                75%  { transform: translate(25px, -40px) scale(1.05); opacity: 0.5; }
            }
        `;
        document.head.appendChild(style);

        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 4 + 2;
            p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;`;
            particlesContainer.appendChild(p);
        }
    </script>
</body>
</html>
